<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Managed websites for Greater Seattle service businesses">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b4a6f" />
      <stop offset="100%" stop-color="#073751" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="0" y="600" width="1200" height="30" fill="#c2410c" />

  <text x="80" y="190" fill="#c8dcea" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" letter-spacing="3">
    MANAGED WEBSITES FOR LOCAL SERVICE BUSINESSES
  </text>

  <text x="80" y="286" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="700">
    Turn your website into
  </text>
  <text x="80" y="360" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="700">
