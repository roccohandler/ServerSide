<!--
  The Forge Stamp, full-bleed for a browser tab.

  This duplicates the geometry in `src/components/brand/Logo.tsx` on purpose: a tab icon
  is requested before any application code exists, so it cannot be the React component.
  It is the same path data shifted by -6 units and drawn in a 88-unit box, so the tile
  reaches the edges instead of floating with the optical padding the lockup needs.

  Change one and change the other.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" role="img" aria-label="JobForge">
  <!-- The struck tile. -->
  <rect width="88" height="88" rx="24" fill="#17191E" />
  <!-- The F's upper arm, tilted forward. -->
  <rect
    x="39"
    y="18.5"
    width="32"
    height="11.5"
    rx="5.75"
    transform="rotate(-14 39 24.25)"
    fill="#F3EEE4"
  />
  <!-- The F's lower arm — always ember. -->
  <rect
    x="39"
    y="37"
    width="28"
    height="11.5"
    rx="5.75"
    transform="rotate(-14 39 42.75)"
    fill="#E85C24"
  />
  <!-- The J, drawn last so its cap closes over both arms. -->
  <path
    d="M39 18.5 L39 56 Q39 67 28.5 67"
    fill="none"
    stroke="#F3EEE4"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
